<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grilla de Horarios - E.E.S.T N°6 "Siderurgia Argentina"</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <!-- Header Institucional -->
    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-full overflow-hidden bg-white/10 border border-slate-700 flex items-center justify-center shadow shrink-0">
                    <img src="logo.png" alt="Logo Escuela" class="w-full h-full object-cover" onerror="this.parentElement.innerHTML='<i class=\'fa-solid fa-school text-indigo-400\'></i>'">
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">E.E.S.T. N°6 "Siderurgia Argentina"</h1>
                    <p class="text-slate-400 text-xs">Sistema de Gestión de Horarios Escolares</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="bg-emerald-900/60 text-emerald-300 border border-emerald-700/50 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-cloud-arrow-up"></i> GitHub Sincronizado
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- Panel de Selección de Curso y Preceptores -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">AÑO</label>
                <select id="selectAnio" onchange="cambiarAnio()" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <option value="1">1° Año</option>
                    <option value="2">2° Año</option>
                    <option value="3">3° Año</option>
                    <option value="4">4° Año</option>
                    <option value="5" selected>5° Año</option>
                    <option value="6">6° Año</option>
                    <option value="7">7° Año</option>
                </select>
            </div>
            <div>
                <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">DIVISIÓN / ORIENTACIÓN</label>
                <select id="selectDivision" onchange="actualizarInfoCurso()" class="w-full border border-slate-300 rounded-xl p-2.5 text-sm font-semibold bg-slate-50 focus:ring-2 focus:ring-indigo-500 outline-none">
                    <!-- Dinámico -->
                </select>
            </div>
            <div class="md:col-span-2 bg-indigo-50/60 border border-indigo-100 rounded-xl p-3 flex items-center justify-between">
                <div>
                    <span class="block text-[10px] font-bold text-indigo-600 uppercase tracking-wider">PRECEPTOR / ES A CARGO</span>
                    <span id="infoPreceptores" class="text-sm font-bold text-indigo-900 mt-0.5">Sin asignar</span>
                </div>
                <button onclick="editarPreceptorActual()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold shadow transition flex items-center gap-1.5">
                    <i class="fa-solid fa-pen"></i> Editar Preceptores
                </button>
            </div>
        </div>

        <!-- Barra de Filtros / Búsqueda Global -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-2 w-full md:w-96">
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-slate-400">
                        <i class="fa-solid fa-search text-xs"></i>
                    </span>
                    <input type="text" id="busquedaGlobal" oninput="renderizarGrilla()" placeholder="Buscar docente, materia o laboratorio..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
            </div>
            <div class="text-xs text-slate-500 font-medium">
                Visualizando grilla de: <span id="labelCursoActual" class="font-bold text-slate-700">5to Año - Div. A</span>
            </div>
        </div>

        <!-- Grilla de Horarios -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left">
                    <thead>
                        <tr class="bg-slate-100 border-b border-slate-200 text-slate-700 text-xs uppercase tracking-wider">
                            <th class="p-3 font-semibold text-center w-36">Módulo / Horario</th>
                            <th class="p-3 font-semibold">Lunes</th>
                            <th class="p-3 font-semibold">Martes</th>
                            <th class="p-3 font-semibold">Miércoles</th>
                            <th class="p-3 font-semibold">Jueves</th>
                            <th class="p-3 font-semibold">Viernes</th>
                        </tr>
                    </thead>
                    <tbody id="tablaHorariosBody" class="divide-y divide-slate-200 text-sm">
                        <!-- Generado por JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para Agregar / Editar Módulo -->
    <div id="modalClase" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 overflow-y-auto max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modalTitulo" class="text-base font-bold text-slate-900">Asignar Clase / Taller</h3>
                <button onclick="cerrarModalClase()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>
            <form id="formClase" onsubmit="guardarClase(event)" class="space-y-3 text-xs">
                <input type="hidden" id="claseId">
                <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-200 text-slate-600 font-medium">
                    Editando para: <span id="modalInfoUbicacion" class="font-bold text-indigo-600"></span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">GRUPO (Concurrente)</label>
                        <select id="modalGrupo" class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                            <option value="">Clase general (Sin división)</option>
                            <option value="G1">Grupo 1 (G1)</option>
                            <option value="G2">Grupo 2 (G2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">AULA / ESPACIO</label>
                        <select id="modalAula" class="w-full border border-slate-300 rounded-lg p-2 outline-none font-medium text-slate-700">
                            <option value="">Aula Común / Teórica</option>
                            <optgroup label="Laboratorios y Talleres">
                                <option value="Lab de Electrónica">Lab de Electrónica</option>
                                <option value="Lab de Programación / Informática">Lab de Programación / Informática</option>
                                <option value="Pañol / Taller de Electromecánica">Taller de Electromecánica</option>
                                <option value="Taller de Ajuste">Taller de Ajuste</option>
                                <option value="Taller de Soldadura">Taller de Soldadura</option>
                                <option value="Taller de Electricidad">Taller de Electricidad</option>
                                <option value="Taller de Hojalatería">Taller de Hojalatería</option>
                            </optgroup>
                            <optgroup label="Salones Específicos">
                                <option value="Salón de Usos Múltiples (SUM)">Salón de Usos Múltiples (SUM)</option>
                                <option value="Biblioteca">Biblioteca</option>
                            </optgroup>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">NOMBRE DE LA MATERIA / TALLER</label>
                    <input type="text" id="modalMateria" placeholder="Ej: AEA / MPE" required class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                </div>
                <div>
                    <label class="block font-semibold text-slate-600 mb-1">DOCENTE (Apellido y Nombre / Situación de Revista)</label>
                    <input type="text" id="modalDocente" placeholder="Ej: (PROV. ARMANI DAMIAN) FILISTEO, MARCELO" required class="w-full border border-slate-300 rounded-lg p-2 outline-none">
                </div>
                <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
                    <button type="button" onclick="cerrarModalClase()" class="px-3 py-2 border border-slate-300 rounded-lg text-slate-600">Cancelar</button>
                    <button type="submit" id="btnGuardarClase" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-medium">Guardar cambios</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        const estructuraCursos = {
            1: [
                { id: '1A', nombre: '1° Año - Ciclo Básico (A)', preceptores: '' },
                { id: '1B', nombre: '1° Año - Ciclo Básico (B)', preceptores: '' },
                { id: '1C', nombre: '1° Año - Ciclo Básico (C)', preceptores: '' },
                { id: '1D', nombre: '1° Año - Ciclo Básico (D)', preceptores: '' },
                { id: '1E', nombre: '1° Año - Ciclo Básico (E)', preceptores: '' }
            ],
            2: [
                { id: '2A', nombre: '2° Año - Ciclo Básico (A)', preceptores: '' },
                { id: '2B', nombre: '2° Año - Ciclo Básico (B)', preceptores: '' },
                { id: '2C', nombre: '2° Año - Ciclo Básico (C)', preceptores: '' },
                { id: '2D', nombre: '2° Año - Ciclo Básico (D)', preceptores: '' }
            ],
            3: [
                { id: '3A', nombre: '3° Año - Ciclo Básico (A)', preceptores: '' },
                { id: '3B', nombre: '3° Año - Ciclo Básico (B)', preceptores: '' },
                { id: '3C', nombre: '3° Año - Ciclo Básico (C)', preceptores: '' },
                { id: '3D', nombre: '3° Año - Ciclo Básico (D)', preceptores: '' }
            ],
            4: [
                { id: '4A', nombre: '4° Año - A (Electrónica)', preceptores: '' },
                { id: '4B', nombre: '4° Año - B (Electromecánica)', preceptores: '' },
                { id: '4C', nombre: '4° Año - C (Electromecánica)', preceptores: '' },
                { id: '4D', nombre: '4° Año - D (Electrónica)', preceptores: '' }
            ],
            5: [
                { id: '5A', nombre: '5° Año - A (Electrónica)', preceptores: 'Páez, Elio / Fito' },
                { id: '5B', nombre: '5° Año - B (Electromecánica)', preceptores: '' }
            ],
            6: [
                { id: '6A', nombre: '6° Año - A (Electrónica)', preceptores: '' },
                { id: '6B', nombre: '6° Año - B (Electromecánica)', preceptores: '' }
            ],
            7: [
                { id: '7A', nombre: '7° Año - A (Electrónica)', preceptores: '' },
                { id: '7B', nombre: '7° Año - B (Electromecánica)', preceptores: '' }
            ]
        };

        const modulosHorarios = [
            { id: 1, rango: "07:45 - 08:45" },
            { id: 2, rango: "08:55 - 09:55" },
            { id: 3, rango: "10:05 - 11:05" },
            { id: 4, rango: "11:10 - 12:10" },
            { id: 5, rango: "12:25 - 13:25" },
            { id: 6, rango: "13:30 - 14:30" },
            { id: 7, rango: "14:40 - 15:40" },
            { id: 8, rango: "15:50 - 16:50" },
            { id: 9, rango: "16:55 - 17:55" }
        ];

        const diasSemana = ["Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
        let clases = [];
        let fileSha = null;

        // Configuración fija de GitHub inyectada directamente
        const gitConfig = {
            user: "damiansn",
            repo: "grilla-horarios",
            token: "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"
        };

        function cambiarAnio() {
            const anio = document.getElementById('selectAnio').value;
            const selectDiv = document.getElementById('selectDivision');
            selectDiv.innerHTML = '';
            
            estructuraCursos[anio].forEach(div => {
                selectDiv.innerHTML += `<option value="${div.id}">${div.nombre}</option>`;
            });
            actualizarInfoCurso();
        }

        function actualizarInfoCurso() {
            const anio = document.getElementById('selectAnio').value;
            const divId = document.getElementById('selectDivision').value;
            const divisionObj = estructuraCursos[anio].find(d => d.id === divId);
            
            if (divisionObj) {
                document.getElementById('infoPreceptores').innerText = divisionObj.preceptores || 'Sin asignar (Hacé clic en Editar)';
                document.getElementById('labelCursoActual').innerText = divisionObj.nombre;
            }
            renderizarGrilla();
        }

        function editarPreceptorActual() {
            const anio = document.getElementById('selectAnio').value;
            const divId = document.getElementById('selectDivision').value;
            const divisionObj = estructuraCursos[anio].find(d => d.id === divId);
            
            if (!divisionObj) return;
            const nuevoPreceptor = prompt(`Ingrese el/los preceptor/es a cargo para ${divisionObj.nombre}:`, divisionObj.preceptores || '');
            if (nuevoPreceptor !== null) {
                divisionObj.preceptores = nuevoPreceptor.trim();
                actualizarInfoCurso();
                guardarDatosRemotos();
            }
        }

        async function cargarDatosRemotos() {
            try {
                const url = `https://api.github.com/repos/${gitConfig.user}/${gitConfig.repo}/contents/horarios.json`;
                const headers = { 'Authorization': `token ${gitConfig.token}` };

                const res = await fetch(url, { headers });
                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    const parsed = JSON.parse(decodeURIComponent(escape(atob(data.content))));
                    clases = parsed.clases || parsed;
                    if (parsed.cursos) {
                        for (let a in parsed.cursos) {
                            if (estructuraCursos[a]) {
                                parsed.cursos[a].forEach(savedDiv => {
                                    let localDiv = estructuraCursos[a].find(d => d.id === savedDiv.id);
                                    if (localDiv) localDiv.preceptores = savedDiv.preceptores;
                                });
                            }
                        }
                    }
                } else {
                    console.warn("No se encontró horarios.json en GitHub o falló la autenticación. Se usarán datos por defecto.");
                    clases = [
                        { id: 1, anio: "5", division: "5A", dia: "Lunes", moduloId: 1, grupo: "", aula: "Lab de Programación / Informática", materia: "ANÁLISIS MATEMÁTICO", docente: "(PROV. CALVIELLO, Natalia) FILISTEO, Marcelo" }
                    ];
                }
            } catch (err) {
                console.error("Error al conectar con GitHub:", err);
            }
            actualizarInfoCurso();
        }

        async function guardarDatosRemotos() {
            try {
                const url = `https://api.github.com/repos/${gitConfig.user}/${gitConfig.repo}/contents/horarios.json`;
                const payload = { clases: clases, cursos: estructuraCursos };
                const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(payload, null, 2))));
                
                const body = {
                    message: "Actualización automática de horarios y preceptores",
                    content: contentEncoded,
                    branch: "main"
                };
                if (fileSha) body.sha = fileSha;

                const res = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${gitConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)
                });

                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.content.sha;
                } else {
                    console.error("Error al guardar en GitHub. Respuesta:", await res.text());
                }
            } catch (err) {
                console.error("Excepción al intentar guardar en GitHub:", err);
            }
        }

        function renderizarGrilla() {
            const anioActual = document.getElementById('selectAnio').value;
            const divActual = document.getElementById('selectDivision').value;
            const busqueda = document.getElementById('busquedaGlobal').value.toLowerCase();
            
            const tbody = document.getElementById('tablaHorariosBody');
            tbody.innerHTML = '';

            modulosHorarios.forEach(mod => {
                let tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50/80 transition";
                
                let html = `<td class="p-3 border-r border-slate-200 bg-slate-50 text-center text-xs align-middle">
                    <span class="block font-bold text-indigo-600">Módulo ${mod.id}</span>
                    <span class="text-slate-500">${mod.rango}</span>
                </td>`;

                diasSemana.forEach(dia => {
                    let clasesFiltradas = clases.filter(c => 
                        c.anio === anioActual && 
                        c.division === divActual && 
                        c.dia === dia && 
                        c.moduloId === mod.id
                    );

                    if (busqueda) {
                        clasesFiltradas = clasesFiltradas.filter(c => 
                            c.materia.toLowerCase().includes(busqueda) || 
                            c.docente.toLowerCase().includes(busqueda) ||
                            (c.aula && c.aula.toLowerCase().includes(busqueda)) ||
                            (c.grupo && c.grupo.toLowerCase().includes(busqueda))
                        );
                    }

                    clasesFiltradas.sort((a, b) => (a.grupo || '').localeCompare(b.grupo || ''));

                    html += `<td class="p-2 border-r border-slate-200 align-top relative group min-h-[85px] cursor-pointer hover:bg-indigo-50/30 transition" onclick="abrirModalCelda('${dia}', ${mod.id})">`;
                    
                    if (clasesFiltradas.length > 0) {
                        clasesFiltradas.forEach(c => {
                            html += `
                                <div class="bg-indigo-50/90 border border-indigo-200 rounded-xl p-2 mb-2 text-xs shadow-sm relative">
                                    <div class="flex justify-between items-start mb-1">
                                        <span class="font-bold text-indigo-950">${c.materia}</span>
                                        ${c.grupo ? `<span class="bg-indigo-700 text-white px-1.5 py-0.5 rounded text-[10px] font-extrabold">${c.grupo}</span>` : ''}
                                    </div>
                                    <div class="text-slate-700 font-medium"><i class="fa-solid fa-user-tie text-[10px] mr-1 text-indigo-500"></i>${c.docente}</div>
                                    <div class="mt-2 pt-1.5 border-t border-indigo-100 flex justify-between items-center text-[11px]">
                                        <span class="font-semibold text-indigo-700">
                                            ${c.aula ? `<i class="fa-solid fa-door-open mr-1"></i>${c.aula}` : 'Aula común'}
                                        </span>
                                        <div class="flex gap-1" onclick="event.stopPropagation()">
                                            <button onclick="editarClase(${c.id})" class="text-indigo-600 hover:text-indigo-900 p-1"><i class="fa-solid fa-pen"></i></button>
                                            <button onclick="eliminarClase(${c.id})" class="text-rose-600 hover:text-rose-900 p-1"><i class="fa-solid fa-trash"></i></button>
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        html += `
                            <div class="text-center mt-1" onclick="event.stopPropagation()">
                                <button onclick="abrirModalCelda('${dia}', ${mod.id})" class="text-[10px] text-indigo-600 hover:text-indigo-800 font-bold bg-white border border-indigo-200 px-2.5 py-1 rounded-full shadow-sm hover:bg-indigo-50 transition">
                                    <i class="fa-solid fa-plus mr-1"></i> Agregar Grupo / Clase
                                </button>
                            </div>
                        `;
                    } else {
                        html += `
                            <div class="h-full min-h-[65px] flex items-center justify-center text-slate-300 text-xs italic group-hover:text-indigo-500 transition">
                                <i class="fa-solid fa-plus mr-1 text-[10px]"></i> Asignar
                            </div>
                        `;
                    }
                    html += `</td>`;
                });

                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        function abrirModalCelda(dia, moduloId) {
            document.getElementById('modalTitulo').innerText = "Asignar Clase / Taller";
            document.getElementById('formClase').reset();
            document.getElementById('claseId').value = '';
            
            const anio = document.getElementById('selectAnio').value;
            const divId = document.getElementById('selectDivision').value;
            const divisionObj = estructuraCursos[anio].find(d => d.id === divId);
            
            const modObj = modulosHorarios.find(m => m.id === moduloId);
            document.getElementById('modalInfoUbicacion').innerText = `${divisionObj.nombre} — ${dia} (Módulo ${moduloId}: ${modObj.rango})`;
            
            document.getElementById('formClase').dataset.dia = dia;
            document.getElementById('formClase').dataset.moduloId = moduloId;

            document.getElementById('modalClase').classList.remove('hidden');
            document.getElementById('modalClase').classList.add('flex');
        }

        function cerrarModalClase() { document.getElementById('modalClase').classList.remove('flex'); document.getElementById('modalClase').classList.add('hidden'); }

        function guardarClase(e) {
            e.preventDefault();
            const id = document.getElementById('claseId').value;
            const anio = document.getElementById('selectAnio').value;
            const division = document.getElementById('selectDivision').value;
            const form = document.getElementById('formClase');

            const nueva = {
                id: id ? parseInt(id) : Date.now(),
                anio: anio,
                division: division,
                dia: id ? clases.find(c => c.id === parseInt(id)).dia : form.dataset.dia,
                moduloId: id ? clases.find(c => c.id === parseInt(id)).moduloId : parseInt(form.dataset.moduloId),
                grupo: document.getElementById('modalGrupo').value.trim(),
                aula: document.getElementById('modalAula').value,
                materia: document.getElementById('modalMateria').value.trim(),
                docente: document.getElementById('modalDocente').value.trim()
            };

            if (id) {
                const idx = clases.findIndex(c => c.id === parseInt(id));
                if (idx !== -1) clases[idx] = nueva;
            } else {
                clases.push(nueva);
            }
            cerrarModalClase();
            renderizarGrilla();
            guardarDatosRemotos();
        }

        function editarClase(id) {
            event.stopPropagation();
            const c = clases.find(item => item.id === id);
            if (!c) return;
            document.getElementById('modalTitulo').innerText = "Editar Módulo";
            document.getElementById('claseId').value = c.id;
            document.getElementById('modalGrupo').value = c.grupo || '';
            document.getElementById('modalAula').value = c.aula || '';
            document.getElementById('modalMateria').value = c.materia;
            document.getElementById('modalDocente').value = c.docente;

            const anio = document.getElementById('selectAnio').value;
            const divId = document.getElementById('selectDivision').value;
            const divisionObj = estructuraCursos[anio].find(d => d.id === divId);
            const modObj = modulosHorarios.find(m => m.id === c.moduloId);
            document.getElementById('modalInfoUbicacion').innerText = `${divisionObj.nombre} — ${c.dia} (Módulo ${c.moduloId})`;

            document.getElementById('modalClase').classList.remove('hidden');
            document.getElementById('modalClase').classList.add('flex');
        }

        function eliminarClase(id) {
            event.stopPropagation();
            if (confirm("¿Estás seguro de eliminar este registro?")) {
                clases = clases.filter(c => c.id !== id);
                renderizarGrilla();
                guardarDatosRemotos();
            }
        }

        window.onload = () => {
            cambiarAnio();
            cargarDatosRemotos();
        };
    </script>
</body>
